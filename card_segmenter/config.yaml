# ===========================================================================
# All the knobs live here so the code stays clean and your runs are reproducible.
# ===========================================================================

data:
  images_dir: data/images        # your RAW tray photos (.jpg). NOT the CLAHE output.
  masks_dir:  data/masks         # one binary PNG per image: <same name>.png, 255 = card
  image_glob: "*.jpg"

  # --- Data discipline: split by DIVE, never by random frame ---------------
  # Filename convention:  <diveId>_<anything>.jpg     e.g.  dive03_frame12.jpg
  # Everything before the first underscore is the "dive id". Frames from the
  # same dive are near-duplicates, so they are kept together in one split.
  val_frac:  0.15                 # used only if val_dives below is empty
  test_frac: 0.15                 # used only if test_dives below is empty
  val_dives:  []                  # e.g. ["dive03"] to pin specific dives to val
  test_dives: []                  # e.g. ["dive07"] to pin specific dives to test

train:
  img_height: 768                 # 4:3 photos -> 1024x768. Both divisible by 32 (U-Net needs that).
  img_width:  1024
  batch_size: 4                   # drop to 2 if you run out of GPU memory
  epochs:     60
  lr:         0.0003
  weight_decay: 0.0001
  early_stop_patience: 12         # stop if val IoU hasn't improved for this many epochs
  num_workers: 2
  seed: 42

model:
  encoder: resnet34               # small, fast, well-pretrained. mobilenet_v2 = even smaller.
  encoder_weights: imagenet       # start from ImageNet so you need far fewer labels

output:
  ckpt_dir: checkpoints
  pred_dir: outputs/predictions
  num_qualitative: 12             # how many overlay images evaluate.py saves
